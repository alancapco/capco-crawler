# Neo4j for the capco_articles knowledge graph.
# Backend (FastAPI) and frontend (Vite) run on the host via ./graph.sh — only Neo4j is containerized.
# Requires Docker Engine 24+ / Compose v2. The neo4j:5.26-community image (~1GB) is pulled on first start.

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: capco-graph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-capco-graph-change-me}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:-capco-graph-change-me}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:
